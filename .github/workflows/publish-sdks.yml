name: Publish SDKs

# Each SDK under sdks/<lang>/ is its own package with its own version and tests.
# On every PR we test each SDK against a real (locally-booted) PUID server. On a
# push to main, after the tests pass, we publish any SDK whose version was bumped
# (i.e. differs from what's on its registry). Bump one folder's version → only
# that package ships. Add a new SDK = add a job below.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: "@puid-dev/client (npm)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Root install gives us the dev server (vite + wrangler) the SDK tests run
      # against, plus oxlint/oxfmt on PATH for the SDK's own lint/format scripts.
      - run: npm ci

      - name: Lint & format-check the SDK
        working-directory: sdks/js
        run: |
          npm run lint
          npm run format:check

      - name: Test against a real PUID server
        run: |
          printf 'ALLOW_DEV_LOGIN="1"\n' > .dev.vars
          npm run dev:e2e > /tmp/puid-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 || { echo "::error::dev server failed to start"; cat /tmp/puid-dev.log; exit 1; }
          cd sdks/js && PUID_ENDPOINT=http://localhost:8799/api npm test

      - name: Publish to npm if the version was bumped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: sdks/js
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view "$NAME" version 2>/dev/null || echo "none")
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "Publishing $NAME@$LOCAL (registry has: $REMOTE)"
            npm publish
          else
            echo "$NAME@$LOCAL already published; nothing to do."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  python:
    name: "puid-client (PyPI)"
    runs-on: ubuntu-latest
    # Mapped here so the publish step can skip cleanly until the secret is set.
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # for the dev server the SDK tests run against
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: pip install ruff pytest build twine
      - run: pip install -e ./sdks/python

      - name: Lint & format-check the SDK
        working-directory: sdks/python
        run: |
          ruff check .
          ruff format --check .

      - name: Test against a real PUID server
        run: |
          printf 'ALLOW_DEV_LOGIN="1"\n' > .dev.vars
          npm run dev:e2e > /tmp/puid-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 || { echo "::error::dev server failed to start"; cat /tmp/puid-dev.log; exit 1; }
          cd sdks/python && PUID_ENDPOINT=http://localhost:8799/api pytest

      - name: Publish to PyPI if the version was bumped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PYPI_API_TOKEN != ''
        working-directory: sdks/python
        run: |
          NAME=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          LOCAL=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          REMOTE=$(curl -fsS "https://pypi.org/pypi/$NAME/json" 2>/dev/null | python -c "import sys,json;print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "none")
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "Publishing $NAME $LOCAL (PyPI has: $REMOTE)"
            python -m build
            TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_API_TOKEN" twine upload dist/*
          else
            echo "$NAME $LOCAL already on PyPI; nothing to do."
          fi

  go:
    name: "puid (Go module)"
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can push a new tag
      - uses: actions/setup-node@v4 # for the dev server the SDK tests run against
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod

      - run: npm ci
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Lint & format-check the SDK
        working-directory: sdks/go
        run: |
          if [ -n "$(gofmt -l .)" ]; then echo "::error::gofmt: these files need formatting:"; gofmt -l .; exit 1; fi
          go vet ./...
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Test against a real PUID server
        run: |
          printf 'ALLOW_DEV_LOGIN="1"\n' > .dev.vars
          npm run dev:e2e > /tmp/puid-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 || { echo "::error::dev server failed to start"; cat /tmp/puid-dev.log; exit 1; }
          cd sdks/go && PUID_ENDPOINT=http://localhost:8799/api go test ./...

      - name: Tag the release if the version was bumped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(tr -d '[:space:]' < sdks/go/VERSION)
          TAG="sdks/go/v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
          else
            echo "Tagging $TAG (publishes github.com/jtwebman/puid/sdks/go@v$VERSION)"
            git tag "$TAG"
            git push origin "$TAG"
            # nudge the Go module proxy so pkg.go.dev indexes the new version
            curl -fsS "https://proxy.golang.org/github.com/jtwebman/puid/sdks/go/@v/v$VERSION.info" || true
          fi

  rust:
    name: "puid-client (crates.io)"
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # for the dev server the SDK tests run against
        with:
          node-version: 24
          cache: npm
      - run: rustup component add rustfmt clippy
      - run: npm ci

      - name: Lint & format-check the SDK
        working-directory: sdks/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Test against a real PUID server
        run: |
          printf 'ALLOW_DEV_LOGIN="1"\n' > .dev.vars
          npm run dev:e2e > /tmp/puid-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 || { echo "::error::dev server failed to start"; cat /tmp/puid-dev.log; exit 1; }
          cd sdks/rust && PUID_ENDPOINT=http://localhost:8799/api cargo test

      - name: Publish to crates.io if the version was bumped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CARGO_REGISTRY_TOKEN != ''
        working-directory: sdks/rust
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          LOCAL=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          REMOTE=$(curl -fsS -A "puid-ci (jtwebman@gmail.com)" "https://crates.io/api/v1/crates/$NAME" 2>/dev/null | jq -r '.crate.max_version' 2>/dev/null || echo "none")
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "Publishing $NAME $LOCAL (crates.io has: $REMOTE)"
            cargo publish
          else
            echo "$NAME $LOCAL already on crates.io; nothing to do."
          fi

  ruby:
    name: "puid (RubyGems)"
    runs-on: ubuntu-latest
    env:
      GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # for the dev server the SDK tests run against
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - run: npm ci
      - run: gem install rubocop -v 1.87.0 --no-document

      - name: Lint & format-check the SDK
        working-directory: sdks/ruby
        run: rubocop

      - name: Test against a real PUID server
        run: |
          printf 'ALLOW_DEV_LOGIN="1"\n' > .dev.vars
          npm run dev:e2e > /tmp/puid-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 || { echo "::error::dev server failed to start"; cat /tmp/puid-dev.log; exit 1; }
          cd sdks/ruby && PUID_ENDPOINT=http://localhost:8799/api ruby -Ilib -Itest test/test_puid.rb

      - name: Publish to RubyGems if the version was bumped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GEM_HOST_API_KEY != ''
        working-directory: sdks/ruby
        run: |
          LOCAL=$(ruby -Ilib -e 'require "puid/version"; print Puid::VERSION')
          REMOTE=$(curl -fsS "https://rubygems.org/api/v1/gems/puid.json" 2>/dev/null | ruby -rjson -e 'print JSON.parse(ARGF.read)["version"]' 2>/dev/null || echo "none")
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "Publishing puid $LOCAL (RubyGems has: $REMOTE)"
            gem build puid.gemspec
            gem push "puid-$LOCAL.gem"
          else
            echo "puid $LOCAL already on RubyGems; nothing to do."
          fi

  php:
    name: "jtwebman/puid (Packagist)"
    runs-on: ubuntu-latest
    env:
      # PAT with contents:write on jtwebman/puid-php (the read-only split Packagist watches).
      SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for `git subtree split`
      - uses: actions/setup-node@v4 # for the dev server the SDK tests run against
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json
          tools: composer

      - run: npm ci
      - name: Install composer deps
        working-directory: sdks/php
        run: composer install --no-interaction --no-progress

      - name: Lint & static analysis
        working-directory: sdks/php
        run: |
          vendor/bin/php-cs-fixer fix --dry-run --diff
          vendor/bin/phpstan analyse

      - name: Test against a real PUID server
        run: |
          printf 'ALLOW_DEV_LOGIN="1"\n' > .dev.vars
          npm run dev:e2e > /tmp/puid-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8799/api/openapi.json >/dev/null 2>&1 || { echo "::error::dev server failed to start"; cat /tmp/puid-dev.log; exit 1; }
          cd sdks/php && PUID_ENDPOINT=http://localhost:8799/api vendor/bin/phpunit

      # Packagist doesn't support subdirectory packages, so we publish a read-only
      # split of sdks/php to jtwebman/puid-php and tag it; Packagist indexes that repo.
      - name: Split & tag puid-php if the version was bumped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SPLIT_REPO_TOKEN != ''
        run: |
          VERSION=$(tr -d '[:space:]' < sdks/php/VERSION)
          TAG="v$VERSION"
          REPO="https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/jtwebman/puid-php.git"
          if git ls-remote --exit-code --tags "$REPO" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already on puid-php; nothing to do."
          else
            echo "Splitting sdks/php → puid-php and tagging $TAG"
            git config user.name "jtwebman"
            git config user.email "jtwebman@gmail.com"
            git subtree split --prefix=sdks/php -b php-split
            git push --force "$REPO" php-split:main
            git tag "$TAG" php-split
            git push "$REPO" "refs/tags/$TAG"
          fi
