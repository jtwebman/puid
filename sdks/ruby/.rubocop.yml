AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false

# Method/length caps add noise without value for a small SDK + its test file.
Metrics:
  Enabled: false

# We raise with keyword args (status:, code:), which needs the .new form.
Style/RaiseArgs:
  EnforcedStyle: compact

# The gem publishes from CI with an API key, not interactive MFA.
Gemspec/RequireMFA:
  Enabled: false

# Prefer double quotes (consistent with the other PUID SDKs).
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Test names like `test_rate_limit_429` carry meaningful HTTP status numbers.
Naming/VariableNumber:
  Enabled: false
