name: Deploy site & API

# Test on every PR; test + deploy to Cloudflare on every push to main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test # node unit proof: 2,000,000 ids, 0 collisions

      # e2e: Playwright boots its own dev server (npm run dev:e2e), which needs
      # ALLOW_DEV_LOGIN to simulate Google sign-in. Local D1 is created on boot.
      - run: printf 'ALLOW_DEV_LOGIN="1"\n' > .dev.vars
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run deploy # vite build && wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
