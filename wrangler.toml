name = "puid"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain. Active once puid.dev's nameservers are pointed at Cloudflare and
# the zone is active in your account. The Worker serves the apex and all paths.
routes = [{ pattern = "puid.dev/*", zone_name = "puid.dev" }]

# D1 (SQLite) holds everything relational: users, accounts, memberships (M:N),
# api keys, oauth clients/codes/tokens, invites, sessions, usage, AND the counter.
# Chosen because the data model is relational (M:N), not for cost. Stays on D1
# even on the paid plan. Durable Objects are now available too, but unnecessary.
# Create with:  wrangler d1 create puid   then paste the returned database_id here.
[[d1_databases]]
binding = "DB"
database_name = "puid"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Inbound social-login secrets (set with `wrangler secret put <NAME>`):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET

[observability]
enabled = true
